name: App de Taxis
on:
  push:
    paths: ['app-taxis/**', '.github/workflows/app-taxis.yml']
  pull_request:
    paths: ['app-taxis/**', '.github/workflows/app-taxis.yml']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-taxis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-taxis/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Empaquetar para hosting
        if: github.event_name == 'push'
        run: node scripts/package-hosting.mjs

      - name: Publicar en Releases (taxiya-servidor)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Servidor de TaxiYa listo para subir a un hosting con Node.js 22.13+ (cPanel/Plesk, VPS, Render…)."
            echo "Compilado desde la rama \`$GITHUB_REF_NAME\` (commit ${GITHUB_SHA::7})."
            echo
            echo "Descarga el zip, descomprímelo en tu hosting y sigue los pasos de \`LEEME.md\`."
          } > notes.md
          gh release delete taxiya-servidor --yes --cleanup-tag || true
          gh release create taxiya-servidor release/*.zip \
            --target "$GITHUB_SHA" \
            --title "TaxiYa servidor (hosting)" \
            --prerelease --latest=false \
            --notes-file notes.md
