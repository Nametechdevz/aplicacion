name: App de Taxis
on:
  push:
    paths: ['app-taxis/**', '.github/workflows/app-taxis.yml']
  pull_request:
    paths: ['app-taxis/**', '.github/workflows/app-taxis.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-taxis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-taxis/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
