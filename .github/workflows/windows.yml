name: Windows desktop

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  VLC_VERSION: "3.0.21"

jobs:
  desktop-tests:
    name: Tests (shared logic, UI render, real libVLC playback)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install libVLC and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libvlc5 libvlccore9 vlc-plugin-base ffmpeg
          mkdir -p "$RUNNER_TEMP/vlc"
          ln -sf /usr/lib/x86_64-linux-gnu/libvlc.so.5 "$RUNNER_TEMP/vlc/libvlc.so"
          ln -sf /usr/lib/x86_64-linux-gnu/libvlccore.so.9 "$RUNNER_TEMP/vlc/libvlccore.so"
      - name: Generate test media
        run: ./scripts/generate-test-media.sh "$RUNNER_TEMP/media"
      - name: Run tests
        run: >
          ./gradlew test --no-daemon --stacktrace
          -Pwebpro.test.media="$RUNNER_TEMP/media"
          -Pwebpro.vlcDir="$RUNNER_TEMP/vlc"
          "-Pwebpro.vlc.args=--aout=dummy"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: desktop/build/screenshots
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: desktop/build/reports/tests

  windows-installer:
    name: Windows installer (.exe / .msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download libVLC ${{ env.VLC_VERSION }} (64-bit)
        shell: pwsh
        working-directory: desktop
        run: |
          $zip = "$env:RUNNER_TEMP\vlc.zip"
          Invoke-WebRequest -Uri "https://download.videolan.org/pub/videolan/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\vlc-extract" -Force
          $src = "$env:RUNNER_TEMP\vlc-extract\vlc-$env:VLC_VERSION"
          $dst = "resources\windows\vlc"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src\libvlc.dll", "$src\libvlccore.dll" -Destination $dst
          Copy-Item "$src\plugins" -Destination $dst -Recurse
          # Not needed by an embedded player: Qt/skins interfaces, visualizations, Lua extensions.
          Remove-Item -Recurse -Force "$dst\plugins\gui", "$dst\plugins\visualization", "$dst\plugins\lua" -ErrorAction SilentlyContinue
          Remove-Item -Force "$dst\plugins\plugins.dat" -ErrorAction SilentlyContinue
          & "$src\vlc-cache-gen.exe" "$dst\plugins"
          Get-ChildItem $dst | Format-Table Name, Length
      - name: Install ffmpeg (test media)
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Generate test media
        run: ./scripts/generate-test-media.sh "$RUNNER_TEMP/media"
      - name: Playback tests with the bundled libVLC
        run: >
          ./gradlew test --no-daemon --tests "*VlcPlaybackIntegrationTest*" --tests "*PlaybackLogicTest*" --tests "*DesktopStorageTest*"
          -Pwebpro.test.media="$RUNNER_TEMP/media"
          -Pwebpro.vlcDir="$GITHUB_WORKSPACE/desktop/resources/windows/vlc"
          "-Pwebpro.vlc.args=--aout=dummy;--verbose=2"
      - name: Build installers
        run: ./gradlew packageExe packageMsi --no-daemon --stacktrace
      - name: Smoke test - install the MSI and launch the app
        shell: pwsh
        working-directory: desktop
        run: |
          $msi = Get-ChildItem build\compose\binaries\main\msi\*.msi | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v msi-install.log" -Wait
          $exe = Get-ChildItem "$env:ProgramFiles\WEBPRO PLAYER" -Filter "WEBPRO PLAYER.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Get-Content msi-install.log -Tail 50; throw "Installed executable not found" }
          Write-Host "Installed at $($exe.FullName)"
          if (-not (Test-Path "$($exe.DirectoryName)\app\resources\vlc\libvlc.dll")) {
            Get-ChildItem -Recurse "$($exe.DirectoryName)" -Filter libvlc.dll | Format-Table FullName
          }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "WEBPRO PLAYER exited during startup (code $($p.ExitCode))" }
          Write-Host "WEBPRO PLAYER is running (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: WEBPRO-PLAYER-Windows
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: desktop/build/reports/tests
      - name: Publish release
        # Tag push, manual run with a tag, or a push whose commit message contains [release].
        if: >
          startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.1' }}
          target_commitish: ${{ github.sha }}
          name: WEBPRO PLAYER ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.1' }}
          body: |
            Instaladores de WEBPRO PLAYER para Windows 10/11 (64 bits).
            - `.exe`: instalador clásico con asistente.
            - `.msi`: instalador para despliegues/administradores.
            Incluyen el motor de vídeo libVLC; no hace falta instalar nada más.
            El APK/AAB de Android está en los artifacts del workflow "Android".
          files: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
