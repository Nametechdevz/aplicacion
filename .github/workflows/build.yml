name: Build & Test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-installer:
    name: Instalador Windows (.exe)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar instalador
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test del binario empaquetado
        run: node tests/e2e/packaged-smoke.mjs "release/win-unpacked/WhatsApp CRM.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-CRM-Setup
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
