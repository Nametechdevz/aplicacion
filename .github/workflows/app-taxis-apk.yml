name: App de Taxis (APK Android)
on:
  push:
    paths: ['app-taxis/**', '.github/workflows/app-taxis-apk.yml']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Dirección del servidor que vendrá preconfigurada en la app (opcional, p. ej. https://taxis.midominio.com)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: app-taxis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-taxis
    env:
      VITE_SERVER_URL: ${{ inputs.server_url || vars.TAXIYA_SERVER_URL }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-taxis/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - name: Compilar la interfaz y copiarla al proyecto Android
        run: npm run android:sync

      - name: Preparar la firma (solo si existen los secretos)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/taxiya.keystore"
            echo "path=$RUNNER_TEMP/taxiya.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        working-directory: app-taxis/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then TASK=assembleRelease; DIR=release; else TASK=assembleDebug; DIR=debug; fi
          ./gradlew --no-daemon "$TASK" -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$(ls app/build/outputs/apk/$DIR/*.apk | head -1)" "$GITHUB_WORKSPACE/out/TaxiYa-$VERSION_NAME.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: TaxiYa-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publicar en Releases (enlace fijo para descargar en el móvil)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "APK de la App de Taxis compilado desde la rama \`$GITHUB_REF_NAME\` (commit ${GITHUB_SHA::7})."
            echo
            echo "**Instalar:** abre esta página desde el móvil Android, descarga \`TaxiYa-$VERSION_NAME.apk\` y ábrelo. Si Android lo pide, permite instalar apps de esta fuente."
            echo
            echo "Al abrir la app, escribe la dirección de tu servidor de TaxiYa."
          } > notes.md
          gh release delete taxiya-apk --yes --cleanup-tag || true
          gh release create taxiya-apk out/*.apk \
            --target "$GITHUB_SHA" \
            --title "TaxiYa APK $VERSION_NAME" \
            --prerelease --latest=false \
            --notes-file notes.md
