name: Compilar APK Recupera Mensajes

# Compila el APK de la app Android de android-recupera/.
# El APK de depuración queda firmado con la clave de debug, así que es
# instalable directamente en el teléfono (activando "orígenes desconocidos").
on:
  push:
    paths:
      - "android-recupera/**"
      - ".github/workflows/android-recupera-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-recupera

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          # Evita que la acción instale el paquete obsoleto "tools".
          packages: "platform-tools"

      - name: Instalar componentes del SDK
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Instalar Gradle 8.9
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar el APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: recupera-mensajes-apk
          path: android-recupera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Copia el APK con un nombre limpio para la Release.
      - name: Preparar APK para la Release
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/recupera-mensajes.apk"

      # Publica el APK como archivo suelto en una Release, para descargarlo
      # directo como .apk desde el navegador del teléfono (sin .zip, sin login).
      - name: Publicar APK en una Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recupera-mensajes-latest
          name: Recupera Mensajes (APK)
          body: |
            APK de la app **Recupera Mensajes** listo para instalar.
            Descarga `recupera-mensajes.apk` y ábrelo en el teléfono
            (activa "instalar apps de orígenes desconocidos").
          files: ${{ runner.temp }}/recupera-mensajes.apk
          make_latest: false
