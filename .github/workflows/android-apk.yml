name: Compilar APK Mi Camión

on:
  push:
    branches: [mi-camion]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-mi-camion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar Android SDK del runner
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar TypeScript
        run: npx tsc --noEmit

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renombrar APK
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk "salida/MiCamion-${{ github.run_number }}.apk"
          ls -lh salida

      - uses: actions/upload-artifact@v5
        with:
          name: MiCamion-apk
          path: salida/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mi-camion-v${{ github.run_number }}
          name: Mi Camión (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: APK de la app de contabilidad del camión. Descarga el .apk desde el celular e instálalo.
          files: salida/*.apk
          make_latest: false
