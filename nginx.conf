##############################################################
# StreamVault — Nginx config
# Copiar a: /etc/nginx/sites-available/streamvault
# Activar:  ln -s /etc/nginx/sites-available/streamvault /etc/nginx/sites-enabled/
# Recargar: nginx -t && systemctl reload nginx
##############################################################

server {
    listen 80;
    server_name _;          # Reemplaza _ con tu dominio si tienes uno

    # Timeouts generosos para streams IPTV
    proxy_connect_timeout   60s;
    proxy_send_timeout      120s;
    proxy_read_timeout      120s;
    send_timeout            120s;

    # Buffer para streams de video
    proxy_buffering         off;
    proxy_request_buffering off;

    # CORS global para todos los endpoints de la app
    add_header 'Access-Control-Allow-Origin'  '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

    # Pre-flight OPTIONS
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Todo lo demás → Express (API + frontend estático)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Caché agresivo para assets estáticos del frontend
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_cache_bypass $http_upgrade;
        expires            7d;
        add_header         Cache-Control "public, immutable";
    }

    # Sin caché para el service worker de PWA
    location = /sw.js {
        proxy_pass         http://127.0.0.1:3001;
        add_header         Cache-Control "no-cache, no-store, must-revalidate";
    }
}
