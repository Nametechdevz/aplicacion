# Apache 2.4 + PHP 8.3 (mod_php o PHP-FPM). Ajuste dominio y rutas.
<VirtualHost *:80>
    ServerName pos.su-dominio.com
    Redirect permanent / https://pos.su-dominio.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName pos.su-dominio.com
    DocumentRoot /var/www/js-pos/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/pos.su-dominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pos.su-dominio.com/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <Directory /var/www/js-pos/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # public/.htaccess enruta todo a index.php; public/uploads/.htaccess impide ejecutar scripts.
    ErrorLog ${APACHE_LOG_DIR}/js-pos-error.log
    CustomLog ${APACHE_LOG_DIR}/js-pos-access.log combined
</VirtualHost>
