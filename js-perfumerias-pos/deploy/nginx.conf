# Nginx + PHP-FPM para JS Perfumerías POS (VPS). Ajuste dominio y rutas.
server {
    listen 80;
    server_name pos.su-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pos.su-dominio.com;
    root /var/www/js-pos/public;          # SOLO la carpeta public es accesible
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/pos.su-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.su-dominio.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8m;              # imágenes de producto (máx. 5 MB en la app)

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Las imágenes subidas nunca se interpretan como código.
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar|pl|py|cgi|sh|html?|svg|js)$ { deny all; }
        add_header X-Content-Type-Options nosniff;
        expires 30d;
    }

    location ~* \.(css|js|svg|woff2|webp|png|jpg)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Cualquier otro .php o archivo oculto queda bloqueado.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
